name: Java CI with MongoDB

on:
  push:
    branches: [ "main" ]  # The workflow will run every time you push to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # The runner environment for the job

    # Defining a service container to run MongoDB for the tests
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Clones your repository onto the virtual machine

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests with Maven
      id: maven_tests
      continue-on-error: true # CRITICAL: Allows pipeline to reach the AI agent step if a unit test fails
      run: |
        set -o pipefail
        mvn test 2>&1 | tee maven_output.log
      env:
        DB_HOST: localhost  # Tells the application that MongoDB is running on the local host of the runner

    # Capture the test output in a log file for potential use by the AI agent
    - name: Run Autonomous AI Agent on Failure
      if: always() && steps.maven_tests.outcome == 'failure'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number || 'false' }}
      run: |
        pip install google-genai requests
        python -c "
        import os
        from google import genai
        try:
            with open('maven_output.log', 'r', encoding='utf-8', errors='ignore') as f:
                full_log = f.read()
            truncated_log = '\n'.join(full_log.splitlines()[-150:])
            client = genai.Client(api_key=os.environ.get('GEMINI_API_KEY'))
            prompt = f'You are an autonomous Senior SRE Expert Agent. A pipeline step failed for Maven JUnit Tests. Analyze this log and provide a Root Cause and Exact Fix:\n\n{truncated_log}'
            response = client.models.generate_content(model='gemini-2.5-flash', contents=prompt)
            final_report = f'### 🤖 CI/CD Autonomous Agent Report\n⚠️ **Pipeline failed at step:** `Maven JUnit Tests`\n\n' + response.text + '\n\n--- \n*Generated automatically by Citadel Autonomous DevOps Agent.*'
        except Exception as e:
            final_report = f'### 🤖 CI/CD Autonomous Agent Report\n⚠️ AI Agent failed to fetch remote recommendations due to API limits or a 503 Service Overload.\nInternal Trace: {str(e)}'
      
        with open('ai_agent_report.md', 'w', encoding='utf-8') as out:
            out.write(final_report)
          "
          echo "=================== AI AGENT REPORT ==================="
          cat ai_agent_report.md
          echo "======================================================="
          exit 1 # Intentionally fail the job at the very end so you know tests failed