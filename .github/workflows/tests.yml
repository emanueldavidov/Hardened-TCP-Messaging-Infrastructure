name: Java CI with MongoDB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests with Maven
      id: maven_tests
      continue-on-error: true
      run: |
        set -o pipefail
        mvn test 2>&1 | tee maven_output.log
      env:
        DB_HOST: localhost

    # Capture the test output in a log file for use by the AI agent
    - name: Run Autonomous AI Agent on Failure
      if: always() && steps.maven_tests.outcome == 'failure'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pip install google-genai requests pydantic
        python scripts/pipeline_agent.py "Maven JUnit Tests" maven_output.log
        exit 1