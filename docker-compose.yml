services:
  # 1. Java Core Engine
  chat-server:
    build: .
    ports:
      - "9999:9999"
      - "8080:8080"
    environment:
      - DB_HOST=mongo
      - DISABLE_SSL=true
    networks:
      - chat-net
    depends_on:
      mongo:
        condition: service_healthy

  # 2. Node.js API Gateway (מתוקן)
  node-api-gateway:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/chatDB
      - BASE_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - chat-net

  react-frontend:
    build: 
      context: ./clients
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - chat-net
    depends_on:
      - node-api-gateway

  mongo:
    image: mongo:4.4
    networks:
      - chat-net
    volumes:
      - chat-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 2s
      retries: 3

networks:
  chat-net:
    driver: bridge

volumes:
  chat-data: