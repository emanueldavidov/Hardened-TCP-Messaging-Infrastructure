apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      securityContext:
        runAsNonRoot: true
        # Optional: Set a specific user ID if needed, e.g., fsGroup or runAsUser
        # runAsUser: 1000
        # fsGroup: 1000
      containers:
      - name: chat-server-container
        image: your-repo/chat-server:latest
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          # Optional: Drop unnecessary capabilities
          # capabilities:
          #   drop:
          #     - ALL
      - name: socat-proxy
        image: alpine/socat
        args: ["TCP-LISTEN:8080,fork", "TCP:localhost:5000"]
        securityContext:
          allowPrivilegeEscalation: false
          # Optional: Drop unnecessary capabilities
          # capabilities:
          #   drop:
          #     - ALL
