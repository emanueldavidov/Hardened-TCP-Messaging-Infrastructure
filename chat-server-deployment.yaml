apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server-deployment
  labels:
    app: chat-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: chat-server-container
        image: your-chat-server-image:latest
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
      - name: socat-proxy
        image: alpine/socat
        command: ["sh", "-c", "socat TCP-LISTEN:8080,fork TCP:localhost:5000"]
        securityContext:
          allowPrivilegeEscalation: false
